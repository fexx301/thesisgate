name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: thesisgate-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      THESIS_LLM_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Validate evaluation packets
        run: npm run eval:packets

      - name: Run evaluation dry run
        run: npm run eval:runner

      - name: Verify published historical evidence integrity
        run: node evals/verify-evidence.mjs

      - name: Production build
        run: npm run build

      - name: Production browser journeys
        run: npm run test:e2e
